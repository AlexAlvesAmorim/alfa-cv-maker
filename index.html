    <script>
      // Tema antes da primeira tinta: evita flash do tema padrão.
      try {
        var t = localStorage.getItem('alfa-theme');
        if (t === 'ocean') t = 'noturno';
        if (t === 'forest' || t === 'system') t = 'blood';
        if (t === 'blood' || t === 'portal' || t === 'noturno' || t === 'paper') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    </script>
